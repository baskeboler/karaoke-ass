[tools]
python = "3.12"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.setup]
description = "Inicializar .venv e instalar el paquete editable para desarrollo y tests"
run = "python -m pip install -e ."

[tasks."setup:speech"]
description = "Inicializar desarrollo e instalar Whisper y sus dependencias"
depends = ["setup"]
run = "python -m pip install -e '.[speech]'"

[tasks."check:ffmpeg"]
description = "Comprobar que FFmpeg esté instalado y accesible"
run = "ffmpeg -version"

[tasks.test]
description = "Ejecutar toda la suite (Whisper y consultas de letras simulados)"
depends = ["check:ffmpeg"]
env = { PYTHONPATH = "src" }
run = "python -m unittest discover -s tests -v"

[tasks."test:lyrics"]
description = "Ejecutar solo las pruebas de búsqueda y corrección de letras"
env = { PYTHONPATH = "src" }
run = "python -m unittest discover -s tests -p test_lyrics.py -v"
