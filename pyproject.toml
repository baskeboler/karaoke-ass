[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocals-karaoke-ass"
version = "0.1.1"
description = "Transcripción local de pistas vocales a subtítulos ASS de karaoke"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
speech = ["openai-whisper==20250625"]

[project.scripts]
karaoke-ass = "karaoke_ass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
